apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-crud
  labels:
    app: demo-crud
spec:
  replicas: 3

  selector:
    matchLabels:
      app: demo-crud

  template:
    metadata:
      name: demo-crud-pod
      labels:
        app: demo-crud

    spec:
      restartPolicy: Always
      containers:
        - name: demo-crud
          image: haseebahmadbutt/spring-crud-demo:1.1.2
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
