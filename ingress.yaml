apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-crud
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-crud   # must match the Service name
                port:
                  number: 8084           # the Service port, not the container port