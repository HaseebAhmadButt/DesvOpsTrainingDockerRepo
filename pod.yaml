apiVersion: v1
kind: Pod
metadata:
  name: demo-crud-pod
  labels:
    app: demo-crud
spec:
  restartPolicy: Always
  containers:
    - name: demo-crud
      image: haseebahmadbutt/spring-crud-demo:1.0.0
      ports:
        - containerPort: 8081
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      startupProbe:
        httpGet:
          path: /actuator/health/liveness
          port: 8081
        periodSeconds: 5
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /actuator/health/readiness
          port: 8081
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /actuator/health/liveness
          port: 8081
        initialDelaySeconds: 20
        periodSeconds: 15
        failureThreshold: 3
